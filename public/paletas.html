<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salda — 20 paletas</title>
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0c0e12;
      color: #e8eaed;
      padding: 24px 16px 48px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 6px; letter-spacing: -0.02em; }
    .lead { color: #9aa3b0; font-size: 0.92rem; margin: 0 0 20px; max-width: 40rem; line-height: 1.45; }
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    }
    .card {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--bg);
      color: var(--fg);
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in oklab, var(--bg) 86%, black);
    }
    .brand { font-weight: 700; letter-spacing: -0.02em; font-size: 0.95rem; }
    .brand i { color: var(--accent); font-style: normal; }
    .num {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .body { padding: 12px; display: grid; gap: 8px; }
    .name { margin: 0; font-size: 0.86rem; font-weight: 700; }
    .desc { margin: 0; font-size: 0.75rem; color: var(--muted); line-height: 1.35; }
    .sw { display: flex; gap: 5px; }
    .sw span {
      width: 22px; height: 22px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .mini {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .stat {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      background: var(--card);
    }
    .stat small {
      display: block;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .stat b { font-size: 1.05rem; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      background: var(--card);
      font-size: 0.78rem;
    }
    .pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: color-mix(in oklab, var(--accent) 16%, transparent);
      color: var(--accent);
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--accent);
      color: var(--accent-fg);
      width: 100%;
    }
    .tip { margin-top: 18px; color: #9aa3b0; font-size: 0.85rem; }

    .p01 { --bg:#070b12; --fg:#f2efe8; --muted:#9aa3b0; --card:#101826; --border:rgba(242,239,232,.08); --accent:#f0a82e; --accent-fg:#1a1408; --accent-soft:rgba(240,168,46,.14); --ok:#2dd4bf; --bad:#f87171; }
    .p02 { --bg:#061018; --fg:#e8f4f7; --muted:#8aa0aa; --card:#0c1a22; --border:rgba(232,244,247,.08); --accent:#2ec4b6; --accent-fg:#04201c; --accent-soft:rgba(46,196,182,.14); --ok:#5eead4; --bad:#fb7185; }
    .p03 { --bg:#0a0f0d; --fg:#eef6f1; --muted:#93a59a; --card:#121a16; --border:rgba(238,246,241,.08); --accent:#3dd68c; --accent-fg:#062016; --accent-soft:rgba(61,214,140,.14); --ok:#86efac; --bad:#f87171; }
    .p04 { --bg:#08090d; --fg:#eef0f6; --muted:#9499ab; --card:#12141c; --border:rgba(238,240,246,.08); --accent:#5b8cff; --accent-fg:#071028; --accent-soft:rgba(91,140,255,.16); --ok:#67e8f9; --bad:#fb7185; }
    .p05 { --bg:#f3efe8; --fg:#1b1814; --muted:#6b645c; --card:#fffdf9; --border:rgba(27,24,20,.1); --accent:#c45c26; --accent-fg:#fff8f2; --accent-soft:rgba(196,92,38,.14); --ok:#0f766e; --bad:#b91c1c; }
    .p06 { --bg:#0d1110; --fg:#eef7f4; --muted:#8fa39c; --card:#151c1a; --border:rgba(238,247,244,.08); --accent:#22c55e; --accent-fg:#052e16; --accent-soft:rgba(34,197,94,.15); --ok:#4ade80; --bad:#f87171; }
    .p07 { --bg:#120b0a; --fg:#f8efec; --muted:#a89490; --card:#1c1312; --border:rgba(248,239,236,.08); --accent:#ff6b4a; --accent-fg:#2a0c08; --accent-soft:rgba(255,107,74,.15); --ok:#34d399; --bad:#fb7185; }
    .p08 { --bg:#0b1020; --fg:#eef2ff; --muted:#9199b8; --card:#131a2e; --border:rgba(238,242,255,.08); --accent:#38bdf8; --accent-fg:#082f49; --accent-soft:rgba(56,189,248,.15); --ok:#67e8f9; --bad:#fb7185; }
    .p09 { --bg:#11100c; --fg:#f6f3e8; --muted:#a39e8c; --card:#1b1a14; --border:rgba(246,243,232,.08); --accent:#eab308; --accent-fg:#292006; --accent-soft:rgba(234,179,8,.15); --ok:#84cc16; --bad:#f87171; }
    .p10 { --bg:#0c0f14; --fg:#eef3f8; --muted:#8f9bab; --card:#141a22; --border:rgba(238,243,248,.08); --accent:#94a3b8; --accent-fg:#0f172a; --accent-soft:rgba(148,163,184,.18); --ok:#2dd4bf; --bad:#f87171; }
    .p11 { --bg:#140a12; --fg:#f8eef5; --muted:#b094a8; --card:#1f121c; --border:rgba(248,238,245,.08); --accent:#f43f5e; --accent-fg:#fff1f2; --accent-soft:rgba(244,63,94,.15); --ok:#34d399; --bad:#fb7185; }
    .p12 { --bg:#0a1210; --fg:#e9f7f3; --muted:#89a79e; --card:#101c19; --border:rgba(233,247,243,.08); --accent:#14b8a6; --accent-fg:#042f2e; --accent-soft:rgba(20,184,166,.15); --ok:#5eead4; --bad:#fb7185; }
    .p13 { --bg:#f7f8fb; --fg:#111827; --muted:#6b7280; --card:#ffffff; --border:rgba(17,24,39,.1); --accent:#2563eb; --accent-fg:#eff6ff; --accent-soft:rgba(37,99,235,.12); --ok:#059669; --bad:#dc2626; }
    .p14 { --bg:#0f1410; --fg:#f0f5ee; --muted:#97a593; --card:#171e18; --border:rgba(240,245,238,.08); --accent:#a3e635; --accent-fg:#1a2e05; --accent-soft:rgba(163,230,53,.14); --ok:#86efac; --bad:#f87171; }
    .p15 { --bg:#101018; --fg:#f0eef8; --muted:#9a96b0; --card:#181824; --border:rgba(240,238,248,.08); --accent:#a78bfa; --accent-fg:#1e1b4b; --accent-soft:rgba(167,139,250,.16); --ok:#34d399; --bad:#fb7185; }
    .p16 { --bg:#120e0a; --fg:#f8f1e8; --muted:#a89988; --card:#1c1712; --border:rgba(248,241,232,.08); --accent:#fb923c; --accent-fg:#431407; --accent-soft:rgba(251,146,60,.15); --ok:#34d399; --bad:#f87171; }
    .p17 { --bg:#08141a; --fg:#e7f6fb; --muted:#87a4b0; --card:#0e1c24; --border:rgba(231,246,251,.08); --accent:#06b6d4; --accent-fg:#083344; --accent-soft:rgba(6,182,212,.15); --ok:#67e8f9; --bad:#fb7185; }
    .p18 { --bg:#f4f1ec; --fg:#1c1917; --muted:#78716c; --card:#fffcf8; --border:rgba(28,25,23,.1); --accent:#0f766e; --accent-fg:#ecfdf5; --accent-soft:rgba(15,118,110,.12); --ok:#047857; --bad:#b91c1c; }
    .p19 { --bg:#0c1018; --fg:#edf2ff; --muted:#8f9bb8; --card:#131926; --border:rgba(237,242,255,.08); --accent:#818cf8; --accent-fg:#1e1b4b; --accent-soft:rgba(129,140,248,.16); --ok:#34d399; --bad:#fb7185; }
    .p20 { --bg:#0b0d0c; --fg:#f2f4f1; --muted:#919891; --card:#141816; --border:rgba(242,244,241,.08); --accent:#f97316; --accent-fg:#431407; --accent-soft:rgba(249,115,22,.15); --ok:#22c55e; --bad:#ef4444; }
  </style>
</head>
<body>
  <h1>20 paletas para Salda</h1>
  <p class="lead">Abre esto en el navegador y dime el número que más te guste (puedes mezclar: “fondo del 10 y acento del 7”).</p>
  <p class="lead" style="margin-top:-10px">Local: <code>http://localhost:3000/paletas.html</code> · o en Vercel: <code>/paletas.html</code></p>

  <div class="grid" id="grid"></div>
  <p class="tip">Cuando elijas, aplicamos esa paleta en toda la app (landing + panel).</p>

  <script>
    const palettes = [
      { id: "p01", n: 1, name: "Navy ámbar", desc: "Actual · confianza + cobro" },
      { id: "p02", n: 2, name: "Océano teal", desc: "Fintech fresca" },
      { id: "p03", n: 3, name: "Bosque esmeralda", desc: "Control / al día" },
      { id: "p04", n: 4, name: "Carbón azul", desc: "SaaS seria" },
      { id: "p05", n: 5, name: "Arena cobre", desc: "Clara y cálida" },
      { id: "p06", n: 6, name: "Verde matriz", desc: "Dinero / OK fuerte" },
      { id: "p07", n: 7, name: "Lava coral", desc: "Urgencia de cobro" },
      { id: "p08", n: 8, name: "Medianoche sky", desc: "Fría y limpia" },
      { id: "p09", n: 9, name: "Grafito limón", desc: "Alto contraste" },
      { id: "p10", n: 10, name: "Acero neutro", desc: "Minimal sin color fuerte" },
      { id: "p11", n: 11, name: "Rubí noche", desc: "Dramática / marca" },
      { id: "p12", n: 12, name: "Laguna teal", desc: "Suave y moderna" },
      { id: "p13", n: 13, name: "Blanco royal", desc: "Clara + azul corporativo" },
      { id: "p14", n: 14, name: "Lima oscura", desc: "Atrevida / joven" },
      { id: "p15", n: 15, name: "Violeta suave", desc: "Más lifestyle" },
      { id: "p16", n: 16, name: "Óxido naranja", desc: "Cálida dark" },
      { id: "p17", n: 17, name: "Cian profundo", desc: "Tech / datos" },
      { id: "p18", n: 18, name: "Crema teal", desc: "Clara y calmada" },
      { id: "p19", n: 19, name: "Índigo night", desc: "Premium oscura" },
      { id: "p20", n: 20, name: "Naranja señal", desc: "CTA muy visible" },
    ];

    const grid = document.getElementById("grid");
    for (const p of palettes) {
      const el = document.createElement("article");
      el.className = "card " + p.id;
      el.innerHTML = `
        <div class="top">
          <div class="brand">Salda<i>.</i></div>
          <div class="num">#${p.n}</div>
        </div>
        <div class="body">
          <p class="name">${p.name}</p>
          <p class="desc">${p.desc}</p>
          <div class="sw">
            <span style="background:var(--bg)"></span>
            <span style="background:var(--card)"></span>
            <span style="background:var(--accent)"></span>
            <span style="background:var(--ok)"></span>
          </div>
          <div class="mini">
            <div class="stat"><small>Debe</small><b style="color:var(--bad)">3</b></div>
            <div class="stat"><small>Pronto</small><b style="color:var(--accent)">2</b></div>
            <div class="stat"><small>Al día</small><b style="color:var(--ok)">18</b></div>
          </div>
          <div class="row"><span>Netflix · María</span><span class="pill">Activo</span></div>
          <button class="btn" type="button">Elegir #${p.n}</button>
        </div>`;
      grid.appendChild(el);
    }
  </script>
</body>
</html>
